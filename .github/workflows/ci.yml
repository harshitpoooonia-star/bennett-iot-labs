name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt nbconvert
      - run: python -m py_compile lab1/sensor_sim.py lab4/ingest.py lab5/generate_dataset.py
      - name: Run lab notebooks
        run: |
          for nb in lab2/*.ipynb lab3/*.ipynb lab5/*.ipynb; do
            (cd "$(dirname "$nb")" && jupyter nbconvert --to notebook --execute "$(basename "$nb")" --output "/tmp/$(basename "$nb")")
          done
